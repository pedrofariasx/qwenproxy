services:
  qwenproxy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Keep in sync with the `playwright` dependency in package.json.
        # `npm run docker:verify` validates this.
        PLAYWRIGHT_VERSION: "1.64.1"
    image: qwenproxy:local
    ports:
      # Both sides use the same PORT: the container listens on the port the
      # .env injects. Mapping 3001->3000 used to break the healthcheck.
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      # Plain list form on purpose: the `path:`/`required:` mapping needs
      # Compose v2.24+, and this keeps older installs working.
      - .env
    environment:
      # Overrides whatever the .env declares, so the container always binds
      # the port it is published on.
      PORT: "${PORT:-3000}"
      HOST: "0.0.0.0"
      # Where the SQLite database and the browser profiles live.
      USER_DATA_DIR: "/app/qwen_profiles"
      # Bind-mounted host directories are owned by the host user. PUID/PGID
      # let the entrypoint remap the unprivileged account to those ids.
      # Empty = keep the account shipped in the image.
      PUID: "${PUID:-}"
      PGID: "${PGID:-}"
    volumes:
      # SQLite (sessions/cooldowns/users) + persistent browser profiles.
      - qwenproxy_data:/app/data
      - qwenproxy_profiles:/app/qwen_profiles
      - type: tmpfs
        target: /tmp
        tmpfs:
          # Chromium needs scratch space; keep it in RAM but bounded.
          size: "${DOCKER_TMPFS_SIZE:-1073741824}"
    restart: unless-stopped
    # Chromium needs a large /dev/shm; the default 64MB crashes it.
    shm_size: "${DOCKER_SHM_SIZE:-1gb}"
    # `deploy.resources` is only honoured by Swarm — plain `docker compose up`
    # silently ignores it, so the limits are declared the Compose v2 way.
    mem_limit: "${DOCKER_MEMORY_LIMIT:-4g}"
    cpus: "${DOCKER_CPUS:-2.0}"
    # Give the server time to drain in-flight streams before SIGKILL.
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # /health only answers after the full boot (per-account header
      # pre-capture with stagger), so the start period is generous to avoid
      # false restarts with several accounts.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qwenproxy_data:
  qwenproxy_profiles:
